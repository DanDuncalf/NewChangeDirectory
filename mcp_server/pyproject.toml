[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ncd-mcp-server"
dynamic = ["version"]
description = "MCP server for NewChangeDirectory (NCD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
ncd-mcp-server = "ncd_mcp_server:main"

[tool.hatch.version]
path = "mcp_server/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ncd_mcp_server.py"]
