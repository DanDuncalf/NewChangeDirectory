ShortDescription: Fast fuzzy directory navigation tool inspired by Norton Commander
Description: |
  NewChangeDirectory (NCD) is a cross-platform command-line directory navigation
  tool inspired by the classic Norton Commander CD command. It maintains a database
  of directory paths across drives/mounts and provides fast, fuzzy search-based
  navigation with an interactive TUI.
