# ============================================================================
# CI — NCD Cross-Platform Build, Test & Package
# ============================================================================
# Runs on push/PR to main branches.
#   Phase 1: Build & test on Windows (x64) and Linux (x64)
#   Phase 2: Cross-compile Linux ARM64 + RISC-V (best-effort)
#   Phase 3: Package distribution archives for all architectures
# ============================================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# ──────────────────────────────────────────────────────────────────────
# Concurrency: cancel in-progress runs for the same branch/PR
# ──────────────────────────────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────
# Default shell settings
# ──────────────────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

# ──────────────────────────────────────────────────────────────────────
# Environment variables shared across jobs
# ──────────────────────────────────────────────────────────────────────
# NCD_VERSION derived from src/control_ipc.h in package job below

jobs:

  # ====================================================================
  # JOB: test-windows — Build + test on Windows x64
  # ====================================================================
  test-windows:
    name: Windows x64 (build + test)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout shared library
        run: git clone https://github.com/DanDuncalf/nshared.git ../shared

      - name: Cache MSVC build objects
        uses: actions/cache@v4
        with:
          path: |
            obj/
            test/obj/
          key: msvc-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'test/**/*.c', 'test/**/*.h', 'test/**/*.py', 'build.bat', 'Makefile') }}
          restore-keys: |
            msvc-

      - name: Build Windows main binaries
        run: cmd /c build.bat
        timeout-minutes: 10

      - name: Build Windows test binaries
        run: cmd /c "cd test && build-tests.bat"
        timeout-minutes: 10

      - name: Run unified test report
        id: windows_tests
        continue-on-error: true
        run: python test/runner.py unit --skip-build --windows-only
        timeout-minutes: 30
        env:
          NCD_TEST_MODE: "1"

      - name: Verify test.results shows PASS
        if: steps.windows_tests.outcome == 'success'
        run: |
          $content = Get-Content test.results -Raw
          if ($content -match "OVERALL STATUS: PASS") {
            Write-Host "PASS confirmed in test.results"
          } else {
            Write-Error "test.results does not show OVERALL STATUS: PASS"
            exit 1
          }
          if ($content -match "FAILED:\s*0") {
            Write-Host "Zero failures confirmed"
          } else {
            Write-Error "test.results shows failures"
            exit 1
          }
          if ($content -match "SKIPPED:\s*0") {
            Write-Host "Zero skips confirmed"
          } else {
            Write-Error "test.results shows skipped tests"
            exit 1
          }

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: test.results
          retention-days: 30

      - name: Upload Windows binaries (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x64
          path: |
            NewChangeDirectory.exe
            NCDService.exe
          retention-days: 1

  # ====================================================================
  # JOB: test-linux — Build + test on Linux x64
  # ====================================================================
  test-linux:
    name: Linux x64 (build + test)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout shared library
        run: git clone https://github.com/DanDuncalf/nshared.git ../shared

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make python3

      - name: Cache Linux build objects (build_x64/)
        uses: actions/cache@v4
        with:
          path: |
            build_x64/
            build_ARM64/
            build_RISC-V/
          key: gcc-x64-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'test/**/*.c', 'test/**/*.h', 'test/**/*.py', 'build.sh', 'Makefile') }}
          restore-keys: |
            gcc-x64-

      - name: Build Linux main binaries (x64)
        run: chmod +x build.sh && bash build.sh x64
        timeout-minutes: 10

      - name: Build Linux test binaries
        run: make -C test all
        timeout-minutes: 10

      - name: Ensure ncd_service exists for tests
        run: |
          if [ -f NCDService ] && [ ! -f ncd_service ]; then
            cp NCDService ncd_service
          fi
          if [ -f ncd_service ] && [ ! -x test/ncd_service ]; then
            cp ncd_service test/ncd_service
          fi

      - name: Run unified test report
        run: sudo -E python3 test/runner.py unit --skip-build
        timeout-minutes: 30
        env:
          NCD_TEST_MODE: "1"

      - name: Verify test.results shows PASS
        run: |
          grep -q "OVERALL STATUS: PASS" test.results || { echo "FAIL: test.results does not show PASS"; exit 1; }
          grep -q "FAILED: 0" test.results || { echo "FAIL: test.results shows failures"; exit 1; }
          grep -q "SKIPPED: 0" test.results || { echo "FAIL: test.results shows skipped tests"; exit 1; }
          echo "Linux tests passed with zero failures and zero skips"

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test.results
          retention-days: 30

      - name: Upload Linux x64 binaries (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-x64
          path: |
            NewChangeDirectory
            NCDService
          retention-days: 1

  # ====================================================================
  # JOB: cross-compile-linux — Linux ARM64 + RISC-V (best-effort)
  # ====================================================================
  cross-compile-linux:
    name: Linux cross-compile (ARM64 + RISC-V)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout shared library
        run: git clone https://github.com/DanDuncalf/nshared.git ../shared

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      - name: Cross-compile Linux ARM64
        run: |
          echo "::group::Cross-compiling for ARM64"
          chmod +x build.sh && CC_ARM64=aarch64-linux-gnu-gcc bash build.sh arm64 || echo "ARM64 build failed (continuing)"
          echo "::endgroup::"

      - name: Cross-compile Linux RISC-V
        run: |
          echo "::group::Cross-compiling for RISC-V"
          chmod +x build.sh && CC_RISCV=riscv64-linux-gnu-gcc bash build.sh riscv64 || echo "RISC-V build failed (continuing)"
          echo "::endgroup::"

      - name: List cross-compiled binaries
        run: |
          echo "=== Cross-compiled binaries ==="
          ls -la NewChangeDirectory_arm64 NCDService_arm64 2>/dev/null && echo "ARM64: OK" || echo "ARM64: not built"
          ls -la NewChangeDirectory_riscv64 NCDService_riscv64 2>/dev/null && echo "RISC-V: OK" || echo "RISC-V: not built"

      - name: Upload cross-compiled ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-arm64
          path: |
            NewChangeDirectory_arm64
            NCDService_arm64
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload cross-compiled RISC-V binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-riscv64
          path: |
            NewChangeDirectory_riscv64
            NCDService_riscv64
          retention-days: 1
          if-no-files-found: ignore

  # ====================================================================
  # JOB: test-linux-arm64 — Build + test natively on ARM64
  # ====================================================================
  test-linux-arm64:
    name: Linux ARM64 (native build + test)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout shared library
        run: git clone https://github.com/DanDuncalf/nshared.git ../shared

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3

      - name: Build Linux ARM64 binaries
        run: chmod +x build.sh && bash build.sh
        timeout-minutes: 15

      - name: Rename for packaging compatibility
        run: |
          mv NewChangeDirectory NewChangeDirectory_arm64 2>/dev/null || true
          mv NCDService NCDService_arm64 2>/dev/null || true

      - name: Upload native ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-arm64-native
          path: |
            NewChangeDirectory_arm64
            NCDService_arm64
          retention-days: 1
          if-no-files-found: ignore

      - name: Build test binaries
        run: make -C test all
        timeout-minutes: 10

      - name: Run unit tests
        run: python3 test/runner.py unit --quick --wsl-only --skip-build
        timeout-minutes: 30
        env:
          NCD_TEST_MODE: "1"

      - name: Verify test.results
        run: |
          grep -q "OVERALL STATUS: PASS" test.results || { echo "FAIL"; exit 1; }
          grep -q "FAILED: 0" test.results || { echo "FAIL: failures"; exit 1; }
          grep -q "SKIPPED: 0" test.results || { echo "FAIL: skips"; exit 1; }
          echo "All Linux ARM64 tests passed"

  # ====================================================================
  # JOB: package — Create distribution packages from all builds
  # ====================================================================
  package:
    name: Create distribution packages
    needs: [test-windows, test-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for packaging scripts)
        uses: actions/checkout@v4

      - name: Extract NCD version from source
        id: ncd_version
        run: |
          VER="$(grep -oP 'NCD_APP_VERSION\s+"\K[^"]+' src/control_ipc.h).0"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: _binaries
          merge-multiple: true

      - name: Organize binaries for packaging
        run: |
          echo "=== Downloaded artifacts ==="
          find _binaries -type f | sort

          # Create package staging directories
          mkdir -p pkg/win-x64 pkg/linux-x64 pkg/linux-arm64 pkg/linux-riscv64

          # Windows x64
          if [ -f _binaries/NewChangeDirectory.exe ]; then
            cp _binaries/NewChangeDirectory.exe  pkg/win-x64/
            cp _binaries/NCDService.exe          pkg/win-x64/
            cp ncd.bat                           pkg/win-x64/
            cp ncd_service.bat                   pkg/win-x64/
            echo "Windows x64: staged"
          else
            echo "WARNING: Windows x64 binaries not found"
          fi

          # Linux x64
          if [ -f _binaries/NewChangeDirectory ]; then
            cp _binaries/NewChangeDirectory  pkg/linux-x64/
            cp _binaries/NCDService          pkg/linux-x64/
            cp ncd                             pkg/linux-x64/
            cp ncd_service                     pkg/linux-x64/
            echo "Linux x64: staged"
          else
            echo "WARNING: Linux x64 binaries not found"
          fi

          # Linux ARM64
          if [ -f _binaries/NewChangeDirectory_arm64 ]; then
            cp _binaries/NewChangeDirectory_arm64  pkg/linux-arm64/
            cp _binaries/NCDService_arm64          pkg/linux-arm64/
            cp ncd                                 pkg/linux-arm64/
            cp ncd_service                         pkg/linux-arm64/
            echo "Linux ARM64: staged"
          else
            echo "Linux ARM64: not available"
          fi

          # Linux RISC-V
          if [ -f _binaries/NewChangeDirectory_riscv64 ]; then
            cp _binaries/NewChangeDirectory_riscv64  pkg/linux-riscv64/
            cp _binaries/NCDService_riscv64          pkg/linux-riscv64/
            cp ncd                                   pkg/linux-riscv64/
            cp ncd_service                           pkg/linux-riscv64/
            echo "Linux RISC-V: staged"
          else
            echo "Linux RISC-V: not available"
          fi

      - name: Add packaging extras (scripts, completions, docs, mcp_server)
        run: |
          for pkgdir in pkg/*/; do
            echo "Adding extras to $pkgdir"

            # Handlers/wrappers
            if [[ "$pkgdir" == *win* ]]; then
              cp packaging/windows/install.bat "$pkgdir/" 2>/dev/null || true
            else
              cp packaging/linux/install.sh "$pkgdir/" 2>/dev/null || true
            fi

            # Completions
            if [ -d completions ]; then
              cp -r completions "$pkgdir/"
            fi

            # MCP server (exclude pycache)
            if [ -d mcp_server ]; then
              rsync -a --exclude='__pycache__' --exclude='*.pyc' mcp_server/ "$pkgdir/mcp_server/"
            fi

            # README
            cp README.md "$pkgdir/" 2>/dev/null || true
          done

      - name: Create distribution archives
        run: |
          mkdir -p dist

          # Windows x64 — ZIP
          if [ -d pkg/win-x64 ] && [ "$(ls -A pkg/win-x64/NewChangeDirectory.exe 2>/dev/null)" ]; then
            (cd pkg/win-x64 && zip -r ../../dist/NCD-${{ steps.ncd_version.outputs.version }}-windows-x64.zip .)
            echo "Created: dist/NCD-${{ steps.ncd_version.outputs.version }}-windows-x64.zip"
          fi

          # Linux x64 — tar.gz
          if [ -f pkg/linux-x64/NewChangeDirectory ]; then
            (cd pkg/linux-x64 && tar -czf ../../dist/NCD-${{ steps.ncd_version.outputs.version }}-linux-x64.tar.gz .)
            echo "Created: dist/NCD-${{ steps.ncd_version.outputs.version }}-linux-x64.tar.gz"
          fi

          # Linux ARM64 — tar.gz
          if [ -f pkg/linux-arm64/NewChangeDirectory_arm64 ]; then
            (cd pkg/linux-arm64 && tar -czf ../../dist/NCD-${{ steps.ncd_version.outputs.version }}-linux-arm64.tar.gz .)
            echo "Created: dist/NCD-${{ steps.ncd_version.outputs.version }}-linux-arm64.tar.gz"
          fi

          # Linux RISC-V — tar.gz
          if [ -f pkg/linux-riscv64/NewChangeDirectory_riscv64 ]; then
            (cd pkg/linux-riscv64 && tar -czf ../../dist/NCD-${{ steps.ncd_version.outputs.version }}-linux-riscv64.tar.gz .)
            echo "Created: dist/NCD-${{ steps.ncd_version.outputs.version }}-linux-riscv64.tar.gz"
          fi

      - name: List distribution packages
        run: |
          echo "=== Distribution packages ==="
          ls -lh dist/

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/*.zip dist/*.tar.gz
          retention-days: 90

  # ====================================================================
  # JOB: summary — Final status check
  # ====================================================================
  summary:
    name: Build summary
    if: always()
    needs: [test-windows, test-linux, cross-compile-linux, package]
    runs-on: ubuntu-latest
    steps:
      - name: Check all job statuses
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A RESULTS
          RESULTS["test-windows"]="${{ needs.test-windows.result }}"
          RESULTS["test-linux"]="${{ needs.test-linux.result }}"
          RESULTS["cross-compile-linux"]="${{ needs.cross-compile-linux.result }}"
          RESULTS["package"]="${{ needs.package.result }}"

          ALL_PASS=true
          for job in "${!RESULTS[@]}"; do
            status="${RESULTS[$job]}"
            if [ "$status" = "success" ]; then
              echo "- ✅ **$job**: passed" >> $GITHUB_STEP_SUMMARY
            elif [ "$status" = "skipped" ]; then
              echo "- ⏭️ **$job**: skipped" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ **$job**: $status" >> $GITHUB_STEP_SUMMARY
              ALL_PASS=false
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$ALL_PASS" = true ]; then
            echo "**✅ All jobs passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**⚠️ Some jobs did not pass**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if core jobs failed
        if: needs.test-windows.result != 'success' || needs.test-linux.result != 'success' || needs.package.result != 'success'
        run: |
          echo "One or more core jobs failed. See summary above."
          exit 1
